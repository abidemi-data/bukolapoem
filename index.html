<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Bukola</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Jost:wght@300;400&display=swap">
<style>
:root{--h:340;--cream:#fbeee6;--soft:#d9bfc0;--gold:#f2c98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);font-family:"Jost",system-ui,sans-serif;font-weight:300;background:#1a1020;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 10%,hsl(var(--h),55%,28%) 0,transparent 55%),radial-gradient(ellipse at 85% 90%,hsl(calc(var(--h) + 50),50%,24%) 0,transparent 55%),linear-gradient(160deg,#1d1026,#2b1428 60%,#1a1020);transition:background 1.6s}
.orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:hsl(var(--h),70%,55%);top:-80px;left:-80px}
.o2{width:300px;height:300px;background:hsl(calc(var(--h) + 60),70%,55%);bottom:-60px;right:-60px;animation-delay:-6s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.2)}}
canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
main{max-width:640px;margin:0 auto;padding:70px 24px 100px}
.page{animation:fade 1.1s ease both;text-align:center}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.serif,h1,h2{font-family:"Cormorant Garamond",Georgia,serif}
.kicker{letter-spacing:.35em;text-transform:uppercase;font-size:.72rem;color:var(--gold);margin-bottom:18px}
h1{font-weight:300;font-size:clamp(3rem,13vw,5.2rem);line-height:1;margin:.1em 0 .3em}
h1 em{font-style:italic;color:var(--gold)}
h2{font-weight:500;font-style:italic;font-size:clamp(2rem,8vw,2.8rem);margin:.2em 0 1em;color:var(--gold)}
.lead{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.35rem;line-height:1.6;color:var(--soft);margin:0 auto 2.2em;max-width:30ch}
.btn{display:inline-block;margin:6px;padding:15px 32px;border-radius:999px;border:1px solid rgba(242,201,138,.6);background:rgba(242,201,138,.12);backdrop-filter:blur(10px);color:var(--cream);font:inherit;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;cursor:pointer;text-decoration:none;transition:.4s}
.btn:hover{background:var(--gold);color:#2b1428;box-shadow:0 0 30px rgba(242,201,138,.4)}
.solid{background:var(--gold);color:#2b1428}
.env{width:150px;height:100px;margin:0 auto 38px;position:relative;border-radius:6px;background:linear-gradient(145deg,#f6dcc9,#e9b9a8);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 60px rgba(242,201,138,.25);animation:float 4s ease-in-out infinite}
.env:before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0);background:#f0c9b6;border-radius:6px}
.env:after{content:"♥";position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);color:#b2475a;font-size:1.3rem}
@keyframes float{50%{transform:translateY(-12px)}}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:42px 26px;box-shadow:0 30px 70px rgba(0,0,0,.35);margin-bottom:30px}
.lines p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(1.25rem,4.6vw,1.5rem);line-height:1.85;opacity:0;animation:fade 1.6s ease forwards}
.lines p.gap{margin-top:1.1em}
.sig{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--gold);font-size:1.3rem;margin-top:1.6em;opacity:0;animation:fade 1.6s ease forwards}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:2.4em;text-align:left}
.tile{display:block;padding:22px 20px;border-radius:20px;text-decoration:none;color:var(--cream);background:linear-gradient(145deg,hsla(var(--c),60%,60%,.22),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);transition:.4s;min-height:118px}
.tile:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.tile b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.05rem;color:var(--gold);font-weight:500;margin-bottom:10px}
.tile span{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;line-height:1.2;font-style:italic}
.shape{position:relative;isolation:isolate;text-align:justify;font-family:"Cormorant Garamond",Georgia,serif;line-height:1.45;color:var(--cream);hyphens:none}
.shape svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:visible}
.shape i{display:block;height:100%}
.shape span{opacity:0;animation:wd 1s ease forwards}
@keyframes wd{to{opacity:1}}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2.4em;color:var(--soft);font-size:.8rem;letter-spacing:.1em}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;padding:9px 16px;font-size:.7rem}
</style>
</head>
<body>
<div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><canvas id="fx"></canvas>
<button class="btn" id="snd">♪ Sound off</button>
<main id="app"></main>
<script>
const FROM="Abidemi";
const LETTER="Dear Bukola,|I know you weren't expecting this.|I know work has been hard on you lately,|a roller coaster of pressure, deadlines and long days|that hardly lets you breathe.|*I miss you, Bukola, more than I can say.|I miss your laugh, your voice, the way you brighten a room|without even trying.|You are on my mind a lot these days,|and I am thinking of you with so much care.|I can't be there beside you yet, but I am with you.|You can trust me on that.|Whatever you face, you don't face it alone,|and I will be your calm, your cheering, your safe place.|*Hear me, Bukola. You are one solid woman.|You are not where you are by accident.|You are here because you deserve it,|and if anyone can carry this, it is you.|*I know you have got this.|I know the plan for your life is a plan of good,|not of evil, to give you a future and a hope.|Don't forget that. Hold on to it.|*So I made you a quiet place to rest,|full of words that believe in you.|Everything will be perfectly fine, in time.|Take your time here.";
const P=[
["You Will Be Fine","I cannot sit beside you tonight,|so I am sending these words in my place.|Listen closely, Bukola, because I mean this:|you will be fine.|Not in some far and foggy someday,|but the way mornings arrive,|a little earlier each time.|The work is heavy, yes, and the days are long,|and I will not pretend they are not.|But you were never made of glass.|You were made of laughter and stubborn light,|of quiet strength you rarely brag about,|and nothing that has tried to dim you has won.|Not the deadlines, not the doubt, not the noise.|I am with you, even from far away.|I always have been, and I always will be."],
["Though I Am Far","Distance is just a number on a map,|and I have never trusted maps to tell the truth.|The truth is I am in every room you walk into,|a quiet shadow of cheering behind your shoulder.|When the phone lights up and the pressure speaks,|when the evening drags its feet,|lean back a little. You will find me there.|Not in body, not yet,|but in the thread that keeps us tied,|the one no schedule and no mile can cut.|I think of you in the small hours,|between one thought and the next,|and every time I whisper, she is going to be okay.|So when the day feels too wide to cross,|trust me, Bukola.|I am holding the other end."],
["The Roller Coaster","Work has been a roller coaster, I know:|the climbs that steal your breath,|the drops that leave your stomach somewhere behind,|the sharp turns no one warned you about.|You have screamed, you have gripped the bar,|you have wondered when it would ever slow.|But listen, every ride has an end,|a gentle slope, a slowing down,|a platform where your feet touch steady ground.|You will step off laughing, hair a mess,|and say, I survived that? I did.|And the people who love you will be waiting there,|arms open, already proud.|Hold on, Bukola. Breathe through the drop.|The best part of the ride is still ahead."],
["The Girl Who Laughs","Somewhere under all this weariness|lives the girl who laughs too loud in public places,|who turns a bad day into a story worth telling,|who makes a whole room lighter by being in it.|She has not gone anywhere.|She is only resting between the storms,|gathering her mischief like a bright coat.|Soon she will be back, eyes shining,|ready to tease me about something ridiculous,|and we will laugh about these months|as a heavy bag she once carried and put down.|Until then I am keeping her laugh safe,|saving a seat for it right beside me,|and I will not let anyone convince me|it has gone for good."],
["Lanterns","Your words are lanterns you have been hanging|on every dark corner of your life.|You never noticed how many there were|until the night got long enough to need them.|Look at the road behind you, the one you walked|when you thought you had nothing left.|See how it glows. See how far you came.|Every hard season, every closed door,|every morning you got up anyway,|became another small light along the way.|A person who can light a path like that|is never truly lost.|So keep walking. Keep writing.|When your own light feels low,|I will carry one of your lanterns beside you."],
["I Miss You","I miss you in the ordinary hours,|in the beat after a joke where you would laugh,|in the empty space beside every story I tell.|I miss your voice saying nothing important|and somehow everything that mattered.|I miss your smile most of all,|the one that arrives before the words do.|You are on my mind in the quiet moments,|and I am thinking of you with so much care,|wishing every hard thing would go easy on you.|Missing you is only love|that has not found a chair yet.|So I send it ahead, across the miles,|folded small inside this poem: I am here."],
["Rest Is Not Surrender","Rest is not giving up, my friend.|The field lies quiet in the winter,|and still, beneath the frost,|every seed is rehearsing spring.|You are allowed to be tired.|You are allowed to put the weight down,|to switch off the phone, close your eyes,|and breathe like nobody is waiting.|The world will not fall if you pause.|It will only wait for you,|the way a good friend waits at a door.|And you will come back softer, wiser, brighter,|with a little more of yourself intact.|Rest. Spring is already on its way to you."],
["What the River Knows","The river does not ask the rocks|why they have blocked its way.|It bends, it hums, it finds another path,|and the rocks become the reason it sings.|You are the river, Bukola.|Every impossible deadline, every heavy week|is only teaching you a new way to flow.|There will be days you feel slow and muddy|and wonder if you are going anywhere at all.|You are. You always are.|Ahead of you, patient and wide,|the sea is waiting with open arms.|You will get there, not by force,|not by being perfect,|but by being exactly who you are."],
["A Letter Across the Distance","Dear you, I hope this finds you softly.|I hope you have eaten something warm today.|I hope that somewhere near your heart|you can feel a hand that is not there|holding yours the way it always would.|You can trust me with the heavy things,|the tears, the tiredness, the days that make no sense.|I will not flinch. I will not leave.|You do not have to be the strong one with me.|You can be tired, quiet, unsure,|and still be exactly enough.|Whatever tomorrow carries toward you,|we will meet it together,|even if together is only a thought across the sea,|and a friend who is always on your side."],
["Morning Will Come","Even the longest night|has never once refused the dawn.|Hold on to that gently,|the way you hold a favourite line of verse.|The light is already getting dressed|somewhere behind the hills,|pulling on its gold, tying its shoes.|It is coming for you, Bukola,|with warm hands and a whole new day.|Every worry that kept you up|will look smaller in that light.|Every knot in your chest will loosen.|You will open the window and breathe,|and the world will feel like it belongs to you again."],
["Poet's Hands","You have the hands of someone|who turns pain into poetry,|who takes the heaviest things|and shapes them into something carriable.|That gift has not left you.|Not under the pressure, not under the noise.|It waits in your chest like a small bright coal.|Blow on it gently. Let it catch.|When the world is too loud, write one line.|Just one. It does not have to be good.|It only has to be true.|It will remind you who you are,|and what you have always been able to do:|take a hard day and make it beautiful.|I have always admired that about you."],
["Held","You are held by more than you know:|by the friends who think of you at odd hours,|by the words you have given the world,|by the older you who already made it through|and leans back across time to whisper, keep going.|You are held by every prayer that carries your name,|by every small kindness you ever planted|that is quietly growing back toward you.|You are held by me,|from here, in this small and stubborn way,|in the only language I have tonight.|Whenever the night makes you feel alone,|remember this poem has your name on it.|You are never as alone as you think."],
["Slow Mending","Healing is not a straight line.|It is a slow stitching, some days a single thread.|But thread by thread the torn thing|becomes whole again,|and stronger in the very place it was mended.|Do not rush it. Do not judge it.|Let the days do their gentle work.|Some mornings you will feel behind.|Some evenings you will feel like you are starting over.|That is allowed. That is part of it.|One morning you will wake up lighter|and not know exactly when it happened.|That is how the best healing arrives,|quietly, like warmth through a window."],
["Not By Accident","You are not here by accident, Bukola.|You are not here by luck, or by chance,|or because someone forgot to check the door.|You are here because you earned it,|because you worked, and doubted, and worked again.|Every seat at every table you have sat in|had your name on it before you arrived.|And if there is anyone who can carry this,|if there is anyone who can see it through,|it is you, and it has always been you.|I know you have got this.|I know it the way I know your voice.|So when the doubt comes knocking,|tell it you have a plan,|and a friend who believes in it,|and a future that is already waiting."],
["Plans of Good","There is a plan for your life, Bukola,|and it is a plan of good, not of evil,|a plan to give you a future and a hope.|Do not forget that on the hard days.|The plan has not been cancelled by pressure.|It has not been erased by a bad week,|or by a heavy season, or by a tired heart.|It is quietly unfolding,|even now, even when you cannot see it,|like a seed turning toward the sun underground.|One day you will look back and understand|why it had to be this way.|Until then, hold on, and keep your faith soft.|Everything is going to be fine,|perfectly, wonderfully, in its own good time.|I am with you until then, and after."]
,["Your Smile","There is a smile you wear when you forget to be tired,|the one that starts in your eyes and reaches everything.|I carry it with me like a small warm coin,|taking it out whenever the day goes grey.|It has never failed to make me lighter.|So here is my wish, Bukola:|that the pressure never gets to keep it for long,|that it comes back to you before the week is out,|bright and unbothered, ready to light up the room.|You deserve to feel as good as you make others feel.|I hope today gave you at least one reason to smile,|and if it did not, let this poem be that reason.|I am smiling right now, thinking of you.|Come back to yourself, gently, and take your time."]
,["Quiet Strength","Nobody applauds the quiet kind of strength,|the kind that gets up before the sun|and does the thing it does not feel like doing.|But I see it, Bukola, and it is magnificent.|It is in the way you keep your word,|the way you carry other people's worries|and still find room to ask how I am.|It is in the way you cry, then wash your face,|then walk back into the room with your head high.|That is not weakness. That is the bravest thing there is.|When you feel like you are barely holding on,|know that barely holding on is still holding on,|and you are holding on beautifully.|I admire you more than these words can say."]
,["Little Things","I think about the little things you do:|the way you tilt your head when you are thinking,|the way your laughter arrives before the joke ends,|the way you say my name like it is easy.|Little things, but they live in me|like small lamps left on in a house.|When the work gets loud and the days run long,|I hope you remember you are made of little wonders too.|Take a breath. Drink some water. Sit by a window.|Let the small kindnesses of the day find you:|a warm cup, a good song, a message from me.|These are tiny, and they are everything.|You are cared for, in a hundred little ways,|and I will keep finding more."]
,["Whenever You Call","Whenever you call, I will pick up.|If it is midnight, I will pick up.|If you have nothing to say and only want the quiet,|I will stay on the line and keep it with you.|You never have to explain why the day was heavy.|You never have to dress your sadness up for me.|Bring it just as it is, crumpled and tired,|and set it down between us.|We will look at it together until it shrinks.|That is what I am here for, Bukola.|Not just for the good days and the easy laughter,|but for the long, hard, unglamorous evenings too.|So call. Message. Or simply think of me.|I will feel it, and I will be there."]
,["The Way You Are","You do not have to be anything more than you are.|Not sharper, not quicker, not endlessly cheerful.|The woman who walks into a room unsure of herself|is just as lovely as the one who commands it.|Work may ask you to be a machine,|but I will always ask you to be a person:|soft, funny, a little stubborn, entirely real.|That is the one I treasure.|That is the one I would choose a thousand times.|So when the world demands a performance,|give it what it needs and keep the rest for yourself,|and keep a little for me.|The real you is more than enough.|The real you has always been enough."]
,["Safe Place","Let me be your safe place for a while.|Not a solution, not an answer, just a place|where you can take your shoes off and breathe.|Here you do not have to be impressive.|Here nobody is keeping score of your tired days.|Here the kettle is always warm|and the light is always kind.|You can say the thing you have been afraid to say.|You can cry without apologising.|You can laugh until it hurts, and then laugh some more.|I will keep this place ready for you, Bukola,|no matter the weather, no matter the hour.|Whenever you need it, it is yours.|The door is open, and I am inside, waiting."]
,["One Step at a Time","You do not have to climb the whole mountain today.|You only have to put one foot in front of the other,|and then do it again when the morning comes.|Big things are built from patient hands.|Strong women are made from ordinary Tuesdays|that they chose not to give up on.|So do the next small thing, and only that.|Answer the one email. Finish the one task.|Drink the glass of water. Close the laptop.|Tomorrow will bring its own small steps,|and you will take those too.|Look back in a year and you will be amazed|at how far one step at a time can carry a person.|I will walk beside you the whole way, in my own way."]
,["Good Things Are Coming","I have a feeling, and I trust my feelings about you:|good things are coming, Bukola.|Not in a vague, hopeful, maybe-someday way,|but in a steady, certain, already-on-the-road way.|I can almost see them turning the corner,|arms full of everything you have been working for.|The recognition. The ease. The long, deep exhale.|The day you will laugh and say,|oh, so that is what all of that was for.|Every late night is paying into something.|Every tear is watering something that will bloom.|Hold on a little longer, my friend.|The best of it is closer than you think,|and I will be cheering the loudest when it arrives."]
,["Proud of You","I do not say it enough, so let me say it now:|I am proud of you.|Proud of the way you keep showing up,|proud of the way you keep your heart soft in a hard place,|proud of the work you do that no one else notices.|Proud of the dreams you still carry,|even on days when they feel heavy.|You are doing better than you think.|You are growing in places you cannot see.|One day you will look back at this season|and feel a quiet pride of your own,|and I hope you will remember that I said it first.|Whatever happens, Bukola,|you have already made me proud, and you always will."]
,["The Distance Between Us","Some days the distance between us feels like a long road|with no lights, no signs, no end.|But then your name appears on my screen,|and the road folds up like a map in my hands.|Distance cannot keep our words from travelling.|It cannot dim the way I think of you.|It cannot stop me from sending you good wishes|every single morning and every single night.|I am learning that closeness is not only a place,|it is a promise, a habit, a steady turning toward.|And I turn toward you, Bukola, again and again.|Wherever you are, you are near to me.|The road is shorter than it looks,|and one day soon it will end at your door."]
,["Soft Landing","If today knocks you down, let it be a soft landing.|Let there be a pillow of kind words,|a blanket of good memories,|a friend at the other end of the line.|You are allowed to fall apart a little.|You are allowed to say, I cannot do this today,|and mean it, and rest.|The world will still be turning tomorrow,|and you will be turning with it, a little stronger.|Falling is not failing. It is only the pause|before you find your feet again.|So fall gently, my friend.|I will be the soft place you land,|and I will help you up when you are ready."]
,["Your Light","Whatever you are going through,|your light has not gone out.|It has only dimmed, the way a candle does in a draft,|and a draft is only a passing thing.|Cup your hands around yourself and be patient.|The flame is still there, steady and golden.|I have seen how it warms the people around you.|I have felt it from miles away.|It reaches me in your voice, in your messages,|in the way you ask if I have eaten.|Do not let a hard season convince you|that you are anything less than radiant.|You are the brightest thing in a lot of rooms,|and you are the brightest thing in mine."]
,["Breathe","Breathe in, slowly, and let your shoulders drop.|Breathe out, and let the hard day leave with it.|Again. In through the quiet, out through the noise.|Feel your feet on the floor,|feel the weight of the day lift a little.|Nothing needs to be solved in this very second.|The inbox can wait, the deadline can wait.|For the length of this poem, you are only a person|who is breathing, and that is enough.|Breathe in the thought that you are loved.|Breathe out the fear that you are alone.|You are not. You never were.|One more breath, and then another.|I am breathing with you, wherever I am."]
,["A Promise","I cannot promise there will be no more storms.|I would be lying, and you deserve the truth.|But I can promise this, and I mean it:|I will not leave you to face them alone.|I promise to listen without hurrying you.|I promise to believe in you on the days you cannot.|I promise to laugh with you when it is over|and to hold your hand in thought while it lasts.|I promise to be honest and kind and steady.|I promise to keep missing you in the best way,|the way that makes me grateful you exist.|Promises are only words, until they are kept,|and I intend to keep every one.|Count on me, Bukola. Always."]
,["Until We Meet","Until we meet, let these words keep you company.|Let them sit beside you at your desk,|ride home with you on the quiet evenings,|and be there when the lights go off.|Let them say what I cannot yet say in person:|you are wonderful, you are capable, you are cared for.|Let the music play softly in the background,|and let your heart settle into its rhythm.|When we do meet, I want to see you smiling,|rested, proud, and a little teary maybe,|and I want to say, I told you so,|in the warmest way a friend ever could.|Until then, take care of yourself for me.|I will be thinking of you, every single day."]
,["Remember Who You Are","When the pressure piles up and the days blur,|remember who you are, Bukola.|You are the girl who finishes what she starts,|who remembers birthdays and small details,|who makes strangers feel like old friends.|You are the woman who has survived every bad week|she ever thought would break her.|That record is perfect, you know.|Every hard day so far, you have outlasted.|Work is only a chapter, not the whole book,|and you are the author, not the character it happens to.|Pick up your pen and write the next page slowly.|Whatever it says, I will be reading,|and I will be on your side of every line."]
,["Your Courage","Courage is not loud, and yours never was.|It is the quiet yes to one more morning,|the steady hand on a trembling day,|the way you try again after being told no.|You think you are only getting by,|but getting by with grace is its own kind of bravery.|I have watched you walk into hard rooms|and walk out still kind.|That is a rare and beautiful thing.|Do not let the tiredness fool you into thinking|that you are anything but brave.|You are lion-hearted in a gentle voice,|and I am lucky to know it.|Keep going, my friend. I am right behind you, cheering."]
,["The Long Way Home","Some roads to where you want to be|are long, winding, and badly lit.|You get tired. You wonder if you took a wrong turn.|But the long way home still ends at home.|Every detour taught your feet something|and every wrong turn showed you a view|you would never have seen otherwise.|You are not behind, Bukola.|You are exactly where you are supposed to be,|on a road that is making you wiser.|Keep your head up and your heart open.|There is a light on at the end of the road,|and someone is standing in the doorway, waiting,|proud, with the kettle on."]
,["Gentle With Yourself","Be gentle with yourself today.|Talk to yourself the way you talk to people you love:|softly, patiently, with room for mistakes.|You would never say to a friend|the things you sometimes say to your own reflection.|So put that voice down for a while.|Say instead, you are doing your best,|and your best is enough for today.|Let the unfinished things stay unfinished.|Let the quiet in, let the pressure out.|Gentleness is not a luxury, it is medicine.|Take it generously, in small spoonfuls, all day long.|I will be gentle with you too,|in every message, every word, every thought."]
,["Sunday Evening","Sunday evening has a particular kind of heaviness,|the weight of Monday leaning on the day.|If it presses on you, I understand.|So let me sit beside you in this hour,|across whatever miles lie between us.|Let me say that the week ahead is not a mountain,|only a series of small hills,|and you have climbed bigger ones than these.|Light a candle. Make something warm.|Put on a song that sounds like home.|Let this be a soft landing before the week begins.|You do not have to be ready, only willing.|And you are not walking into Monday alone,|because I am walking in with you."]
,["What I Wish for You","I wish you mornings that arrive gently|and evenings that end in laughter.|I wish you a desk that feels lighter|and a mind that sleeps without worry.|I wish you colleagues who are kind|and a boss who sees how hard you try.|I wish you rest that actually restores you,|and meals you eat slowly, with no phone beside the plate.|I wish you the kind of luck that finds you|even when you stopped looking for it.|I wish you every dream you have quietly carried.|And when the wishing is done,|I wish you remember that someone out here|wishes all of this for you, every single day."]
,["Rain on the Window","Listen to the rain on the window, Bukola.|It is washing the world while you rest.|Every drop is carrying something away:|the arguments, the deadlines, the tight shoulders,|the thoughts you could not put down.|Let the rain do some of the work today.|Let the grey be soft instead of sad.|After rain, the whole sky smells like beginnings,|and the streets shine like they have been forgiven.|You are being washed too, in your own way,|made ready for something clearer.|When the clouds finally part, you will be lighter.|Until then, listen, and let it fall.|I am listening with you, from a long way off."]
,["You Are Enough","You are enough, even on days you do not feel it.|You are enough with the unfinished list,|enough with the tired eyes and the cold tea,|enough when you cannot find the right words,|enough when the work does not go perfectly.|Your worth was never tied to your output.|It was never a thing the world could grade.|It was written into you before you ever took a job|or answered an email or proved a thing.|You are enough because you are you,|funny, thoughtful, stubborn, kind.|Please keep this one thought in your pocket:|you are loved without conditions,|and nothing about today can change that."]
,["My Favourite Voice","Out of all the voices in my day,|yours is the one I would pick out of any crowd.|It has a warmth that makes ordinary words glow.|When you laugh, the whole conversation lightens.|When you are quiet, I lean in to listen to the quiet.|So when you feel unheard at work,|when your ideas slip past in noisy rooms,|remember that your voice matters to me,|and it matters in the world, more than you know.|Keep using it. Keep speaking up, gently or boldly.|The right people will hear it, I promise.|And if no one else does, I will,|every time, with my whole attention,|because it is my favourite voice there is."]
,["The Garden Inside","There is a garden inside you, Bukola,|and a hard season has only frosted it for a while.|Underneath, the roots are strong and patient.|They know exactly what they are doing.|Every kindness you have ever given|is a seed that is already pushing toward the light.|Do not be discouraged by the bare branches.|Bare branches are only branches waiting.|Water yourself with rest, with music, with friends.|Feed yourself good words and good bread.|One morning you will step outside|and find the whole garden in bloom,|and you will remember I said so,|and we will smile at how long you doubted it."]
,["Through the Window","If I could, I would stand outside your window|and leave something small on the sill:|a note, a flower, a bar of chocolate,|something to say, I was here and I was thinking of you.|Since I cannot, I leave this poem instead.|Let it sit on the windowsill of your day.|Let the morning light fall across it.|When you have a moment, pick it up and read it slowly.|You will find your name in every line,|and a little warmth tucked between them.|I want your hard days to hold some small surprise,|some proof that the world has a soft side.|You are looked after, Bukola,|even from the other side of the window."]
,["Brave and Tired","You can be brave and tired at the same time.|They are not enemies, they are roommates.|You can be strong and still need to cry.|You can be capable and still need a hand.|Do not let anyone tell you that needing rest|means you are not made for the work.|Even the best horses are brought in from the field.|Even the sun goes down so the world can sleep.|You are allowed to put your armour on the chair|and take a long, slow, undisturbed breath.|Tomorrow you will pick it up again, lighter.|For tonight, let me be the one who keeps watch.|Sleep, my friend. You have earned the quiet."]
,["Lighthouse","A lighthouse does not chase the ships.|It only stands where it is and keeps its light on,|and that is how sailors find their way.|Be a lighthouse today, Bukola.|Stand steady in the storm of the workday.|Let the waves crash and the wind complain.|Your light is not in danger of going out.|Others look to you more than you realise,|for calm, for kindness, for a sense of direction.|And when you feel like the one in the dark,|look for the small bright point that is me,|a warm window on some far shore,|a friend whose light is on for you,|every night, until you are safely home."]
,["A Warm Cup","Make yourself something warm to drink.|Tea, coffee, cocoa, whichever you love.|Hold it with both hands and feel the heat travel up your arms.|This is a small ritual, and it is yours.|For these few minutes, nothing is required of you.|Watch the steam curl up and disappear.|Let your thoughts do the same.|If the day was a hard one, say so out loud.|If it was a good one, say thank you to it.|Either way, you made it to this cup,|and that is a small victory worth toasting.|I am raising my own cup from here,|to you, to the evening, to better days ahead.|Cheers, Bukola. Here is to you."]
,["Tomorrow Has Your Name","Tomorrow has your name written all over it.|Not as a burden, but as an invitation.|It is a fresh page, a clean slate, a new light,|and it is holding the door open just for you.|You do not have to carry today into it.|Leave the worries by the door like muddy shoes.|Walk in with your open hands and your quiet courage.|Something small and lovely is waiting there:|a good message, a kind word, a solved problem,|a laugh you did not see coming.|You have a way of turning days around,|and I have seen you do it again and again.|So sleep well tonight, Bukola.|Tomorrow is ready for you, and so am I."]
,["Emmanuel","They named Him Emmanuel, God with us,|and that name was never only for a manger.|It was for the quiet office at the end of a long day.|It was for the commute, the inbox, the heavy drive home.|It is for you, Bukola, right now, wherever you are.|He is not watching from far away.|He is in the room, in the breath, in the silence.|When the pressure rises, He is there before you speak.|When your words run out, He understands the groan.|You may feel alone, but the name says otherwise.|God with you, not someday, but this very hour.|Lean into that name like a tired child leans into a shoulder.|He has never once left, and He is not about to start.|Emmanuel is with you, and so am I, in prayer."]
,["God Is With You","Hear this tonight and let it settle:|God is with you.|Not behind you, disappointed at your pace.|Not above you, waiting for you to get it right.|With you, in the very middle of the mess.|He is in the long meeting and the quiet kitchen.|He is in the tears you did not let anyone see.|He is in the whisper that says, keep going.|You are not walking this road on your own strength,|though your strength is more than you know.|There is a hand holding yours that never gets tired.|There is a love around you that never runs thin.|Rest in it, Bukola, as in a warm, wide river.|You are carried, even when you cannot feel the water."]
,["The Fourth in the Fire","When the three walked into the furnace,|a fourth was seen walking with them, unharmed.|That story is for you, Bukola.|Whatever fire this season has lit around you,|the pressure, the heat, the hours that burn,|you are not walking in it alone.|Someone is in there with you,|and the flames have no power to destroy you.|You will come out without even the smell of smoke,|only a quiet knowing that you were kept.|The fire is real, and so is the One beside you.|Keep walking steady, keep your head high.|You are being protected in ways you cannot see,|and the fire will be only a story you tell."]
,["Peace Beyond Understanding","There is a peace that makes no sense on paper,|a calm that stays when the facts say panic.|I pray that peace over you tonight, Bukola.|Let it settle on your shoulders like a warm shawl.|Let it slow your heartbeat and loosen your jaw.|It does not ask you to understand everything.|It only asks you to hand over what is too heavy.|Give Him the deadlines, the worries, the what-ifs.|Give Him the people who make things hard.|He is strong enough to carry all of it,|and gentle enough to carry it without complaint.|When you wake, may the peace still be there.|May it follow you into every room, every call.|May it guard your heart like a quiet, faithful friend."]
,["He Goes Before You","Before you walk into tomorrow,|He has already been there.|He has already smoothed the places that scare you.|He has already put the right people in the room.|He has already prepared the words you will need.|You do not enter the day unarmed or unannounced.|You walk into a day that was made ready for you.|So when your stomach tightens at the thought of Monday,|remember who is going ahead of you, Bukola.|The One who parts seas can handle a schedule.|The One who feeds sparrows has not forgotten you.|Walk in with your head up and your hands open.|Doors are already unlocking on the road ahead,|and He is whispering, come, I am here."]
,["Strength Renewed","They say those who wait on God|rise up on wings like eagles.|I have been thinking of that for you.|You have been running, and you are tired,|but the strength you need is not the kind you make.|It is the kind you receive, quiet and sudden,|like wind lifting a bird that had stopped flapping.|So wait a little, Bukola. Breathe. Let go.|Let Him lift what you cannot lift.|There is a rise coming, a gentle climbing above the storm,|where the air is clear and the view is wide.|You will run and not be weary.|You will walk and not faint.|And on that day you will remember this poem and smile."]
,["Still Waters","Somewhere there is a table in the middle of your trouble,|and green grass, and still water.|You are being led there, Bukola, even now.|The Shepherd knows the way, and He is not in a hurry.|He knows you are tired.|He knows the noise has been loud.|He is leading you, patiently, to a quiet place|where your soul can finally be restored.|You do not have to find the path on your own.|You only have to follow, one step, one breath at a time.|Even in the valley, even in the shadow,|you will fear no evil, because He is with you.|Let the still waters do their work.|Let your spirit drink deeply and be made whole."]
,["A Prayer for You","Father, I bring Bukola to You tonight.|You know her better than I ever could.|You know the weight she carries and the hope she keeps.|Cover her with Your peace like a blanket.|Give her wisdom for every conversation,|strength for every long hour,|favour in every room she walks into.|Calm every anxious thought before it grows.|Surround her with kind people and good news.|Let her sleep deeply and wake with joy.|Remind her that she is Yours,|and that nothing can pull her out of Your hand.|Make her smile come back, and make it last.|In Your name, amen. From Abidemi, with all my heart."]
,["Grace for This Season","There is grace for this season, Bukola.|Not grace for next year, not grace for yesterday,|but fresh grace, enough for today.|It arrives quietly, like morning light through blinds.|It carries you when your own legs shake.|It makes the impossible hour bearable.|You may not feel it while you are in it,|but later you will say, how did I get through that?|And the answer will be: grace.|You were never meant to hold this up on your own.|When your strength ends, His begins.|When your wisdom runs out, His takes over.|So ask for it, receive it, and rest in it.|It is already yours, running over, more than enough."]
,["Faith Over Fear","Fear will tell you a long and noisy story|about everything that could go wrong.|Do not give it a chair.|Faith tells a shorter, quieter story:|you are held, you are guided, you are not forgotten.|Choose the quiet one, Bukola.|Say it aloud if you need to,|I am not afraid, because He is with me.|Say it in the car, at the desk, in the dark.|Fear shrinks when it is spoken to by faith.|It loses its voice, it loses its grip.|And what you thought was a giant|turns out to be a shadow on the wall.|Walk forward. The light is behind you and ahead of you."]
,["He Holds Tomorrow","You do not know what tomorrow holds,|but you know Who holds tomorrow.|That is enough, Bukola.|It has always been enough, for every generation|that learned to walk without seeing the whole road.|He has numbered your days with tenderness.|He has written your name on His palm.|He is not surprised by anything that comes your way,|and He is not unprepared.|So loosen your grip on the future.|Let your shoulders fall. Let your fists open.|The One who made the stars is minding your small hours.|Sleep, and let Him keep watch.|Tomorrow is in good hands. So are you."]
,["The Shepherd Walks With You","Picture a shepherd on a long evening road,|counting every sheep and noticing the one who limps.|He slows His walk to match hers.|He does not scold, He does not rush.|He carries her when she cannot go on.|That is how He walks with you, Bukola.|He has noticed your tired steps.|He has heard the quiet things you have not said.|There is no shame in being carried.|There is no deadline on His kindness.|You are His, and He guards what is His.|So rest on His shoulder for a while.|Home is not far, and you are not lost."]
,["Mercies New Every Morning","Every morning arrives with fresh mercy.|Not a leftover supply, not a stretched-out ration,|but new, shining, handed to you with the dawn.|Yesterday's mistakes do not follow you into today.|Yesterday's fears do not get a vote.|You wake, and the page is clean,|and the love that wrote it is the same love|that has been faithful since before you were born.|Great is that faithfulness, Bukola.|Great and quiet and patient,|and it has your name on it.|So rise. Open the curtains.|Let the new mercy fall across your face.|Today is a gift, and so are you."]
,["Be Still","Be still, and know that He is God.|It is an invitation, not a scolding.|Be still, because the work will not collapse|if you stop holding your breath.|Be still, because the One in charge is not you.|Let that be a relief, my friend, not a fear.|There is a God who runs the universe|and has no trouble running your Tuesday.|Hand Him the tangle of it all.|Close your eyes. Let your breathing slow.|He is bigger than the deadline.|He is nearer than your next thought.|In the stillness you will hear Him say,|peace, child. I am with you. I have this."]
,["Your Name Is Known","Out of all the people on earth,|your name is known to the One who made the stars.|It is not lost in the crowd.|It is not a number in a file.|He knows it the way a mother knows her child's cry.|He knows when you sit and when you rise.|He knows the secret ache and the secret joy.|And knowing all of it, He loves you still,|completely, gently, without ever running out.|That is who is walking beside you, Bukola.|That is who has been with you since the beginning.|Emmanuel. God with you. Always.|And I thank Him every day|that He put you in my life."]
,["Our Jokes","Remember the joke only we understand?|I still smile when I think of it.|Some people give you a laugh|that lasts a minute and fades.|You give a laugh that lingers for days.|Work may be heavy, Bukola,|but you are lighter than you know.|Tell the day a joke, just to spite it.|Send me the funniest thing you saw.|Let humour be your small rebellion.|Pressure hates being laughed at.|Laugh, even a little, even badly.|I will laugh with you, even from far.|Our jokes are waiting for us."]
,["Dancing in the Kitchen","Put on a song and dance badly.|Do it in the kitchen, in your socks.|Nobody is judging your two left feet.|Joy does not need an audience.|It only needs a moment and a little music.|Shake the day off your shoulders.|Spin once for every worry.|Laugh at yourself, kindly.|I would love to see you do it.|The girl who dances is still in there,|and she is stronger than the deadline.|Let the rhythm remind you who you are.|Turn it up, Bukola. Turn it up louder.|Life is happening right here, to music."]
,["A Friend Like You","Some friends arrive like sunrise.|You were one of those for me.|You listen like it is the only thing on earth.|You remember the small things I forgot saying.|You make hard days feel survivable.|A friend like you is rare, Bukola,|rarer than gold and twice as warm.|I do not take it lightly.|I hope I give you even half of that.|Today, let me be the one who listens.|Tell me everything, or tell me nothing.|I will sit with you either way.|Friendship is the quiet miracle of my year,|and you are the best part of it."]
,["Silly Things I Love","I love how you hum when you think.|I love how you talk to your food.|I love how you laugh at your own jokes|before you reach the punchline.|I love how seriously you take small things|and how lightly you take big ones.|I love your strong opinions on trivial matters.|I love how you light up around kind people.|These silly things make up a whole person,|and that person is a gift.|Stress cannot erase a single one.|They are all still there, waiting.|Let them out to play again soon.|The world needs more of your silly, wonderful self."]
,["Someday Soon","Someday soon we will sit together,|a table between us, tea going cold,|and talk for hours about nothing.|You will tell me the whole story of this season,|and we will laugh at the worst parts.|I am holding that day in my mind|like a photo I have not taken yet.|Until then, hold it with me.|Let it be the light at the end of the week.|Distance is a short chapter.|Our story is a long, warm book.|Keep turning the pages, Bukola.|The best scenes are still unwritten,|and I plan to be in all of them."]
,["Eat Something Warm","Stop what you are doing and eat something.|I mean it, something real, something warm.|You are not a machine that runs on deadlines.|You are a person who needs bread and rest.|Sit down for ten minutes, phone away.|Taste what you are eating.|Let your shoulders unclench between bites.|Nobody ever regretted a proper lunch.|The work will still be there, I promise.|But you need to be there too, whole and fed.|Small acts of care add up to big strength.|Take care of the body that carries your dreams.|I am telling you this because I care.|Now go. Eat. Then keep being wonderful."]
,["Your Laugh","There is a sound I would know anywhere.|It starts small and then spills over.|It fills the room before you even notice.|It has pulled me out of grey days.|I have replayed it in my mind,|the way you replay a favourite song.|So here is my wish for you, Bukola:|that you laugh today, and loudly.|That something silly catches you off guard.|That a joke finds you in a meeting.|That your shoulders shake and your eyes water.|Laughter is a kind of prayer,|a thank-you to a world that still has joy.|I am listening for yours, wherever I am."]
,["Team of Two","You are not doing this alone, you know.|I am on your team, even from here.|Think of me as your quiet partner,|the one in your corner with a water bottle.|When you need a pep talk, I have one ready.|When you need a vent, my ears are open.|When you need silence, I will be silent.|We are a team of two against the heavy day.|Teams win by showing up for each other,|and I will always show up for you.|Pass me the weight whenever you want.|Share the worry, halve the weight.|That is what friends are for, Bukola.|Count me in, today and every day."]
,["Little Wins","Celebrate the little wins today.|You answered that email. That is a win.|You got out of bed. That is a win.|You spoke kindly to yourself. A big win.|You drank water, you took a breath, you tried.|Wins do not have to be loud to count.|Collect them like pretty stones in a pocket.|By the end of the week you will have a handful.|And you will see how far you have come.|I am clapping for every one of them.|Clap for yourself too, Bukola.|You deserve your own applause.|Progress is made of small, stubborn victories,|and you are full of them."]
,["Good Company","You are good company, even in silence.|I could sit beside you for an hour|and say nothing, and feel perfectly at home.|That is a rare gift, Bukola.|Some people fill a room with noise.|You fill it with a feeling of safe.|When people talk about you,|they say you make things feel okay.|Remember that when you doubt yourself.|You are the person others are glad to see.|The one whose call makes a day brighter.|Do not let a hard week hide that.|Your presence is a present.|I am glad, always, to be in your company."]
,["Your Dreams Are Valid","Do not let a hard year shrink your dreams.|They are still yours, still valid, still alive.|You wrote them down when you were braver,|and you are braver now, not less.|Some dreams ripen slowly, like mangoes in the sun.|Slow does not mean never, Bukola.|Keep one hand on your dream, always.|Do the next small step toward it.|Even a single line, a single call, a single plan.|The faithful and the patient get rewarded.|I have seen how you work and how you hope.|Dreams like yours do not stay dreams.|They become mornings you wake up inside.|I believe in every one of them."]
,["Monday Courage","Monday is coming, and so is your courage.|It arrives when you need it, never before.|You do not have to feel ready.|Courage is just the next step, afraid but taken.|Pack your lunch, pack your calm.|Tuck a kind thought in your pocket.|When the day gets sharp, touch it.|Remind yourself you have done this before.|You survived every Monday that ever tried you.|You will outlast this one, too.|And on Friday evening you will smile,|tired but proud, stretched but standing.|I am cheering from the sidelines, Bukola.|Go gently. Go bravely. Go as yourself."]
,["When Work Is Hard","Some people at work will not see you clearly.|Their words may be sharp, their moods unfair.|But their opinion is not your identity.|You are not what a tired boss says in a hurry.|You are not a mistake, or a number, or a task.|You are a whole person with a good heart.|Do your work with quiet dignity.|Answer tension with calm, and let it drain.|Remember the ones who truly know your worth.|I am one of them, loudly and always.|Keep your head up, Bukola, and your voice kind.|People like you outgrow rooms that do not see them.|Better doors are already opening ahead.|Walk through them when they come."]
,["You Are Good at This","You are better at this than you think.|The self-doubt is loud, but it is not accurate.|You have solved harder things than this.|You have learned quickly when others froze.|You have a mind that sees what others miss.|Do not shrink when you should shine.|Share your ideas, even when your voice shakes.|The right people will lean in to listen.|If nobody does, say it anyway,|because it is still good, and still true.|Your competence is real, Bukola.|Your effort is visible to those who matter.|I have seen it, and I am impressed.|Trust yourself. You have earned your seat."]
,["Burnout Is Not Failure","If you feel burnt out, you are not failing.|You have simply given more than you had.|That is what dedicated people do.|But even the strongest flame needs oxygen.|Give yourself room to breathe again.|Say no to one thing this week.|Take a real lunch. Take a real weekend.|Switch off, without apology.|You are allowed to refill before you pour.|Rest is part of the work, not its enemy.|Your best work comes from a restored heart.|Look after her, Bukola, the one who does it all.|She has been brave long enough.|Let her be soft for a while."]
,["The Next Chapter","This season is not the whole story.|It is a chapter, perhaps a difficult one.|But chapters end, and new ones begin.|The next one is already being written.|I suspect it has better light in it.|I suspect it has laughter and ease and room.|You will look back from that chapter|and say, I am glad I stayed through the hard part.|You will thank the girl who kept going.|She is you, Bukola, right now.|Keep turning the page, even slowly.|I will be reading beside you,|bookmark in hand, hopeful and proud.|The best chapter is still ahead."]
,["Small Hours, Big Dreams","In the small hours, when worries get loud,|remember how many dreams you still hold.|They are bigger than the problem.|They are older than the problem too.|The problem is new, and it will pass.|The dream is old, and it is patient.|Close your eyes and picture it clearly:|the place, the people, the feeling in your chest.|Hold that picture like a lantern.|Let it light up the dark room of tonight.|Sleep with it, wake with it, walk toward it.|Bukola, you are closer than you can see.|Every difficult night is a step nearer.|Dream on. I am dreaming with you."]
,["Persistence","They say the river carved the canyon,|not by force, but by showing up daily.|Drop by drop, year after year.|Persistence is quiet and unbeatable.|You are doing that, Bukola, day after day.|Even when no one notices, you are carving.|Even when it feels slow, you are shaping something:|a life, a career, a character.|One day someone will stand at the rim|and marvel at what you have made.|They will not see the thousand small days.|But you will remember, and so will I.|Keep dripping. Keep carving. Keep going.|The canyon is beautiful because you did not stop."]
,["Your Voice at Work","Speak up, even when your voice trembles.|It is allowed to tremble and still be heard.|Your ideas are worth the air they take.|If you wait for perfect confidence, you will wait forever.|Confidence is built by speaking anyway.|Say the thing. Share the plan. Ask the question.|Nobody else sees the angle that you see.|Your perspective is rare and useful.|Do not apologise for taking up space.|Take the space. It was made for you.|I want you to be fully seen, Bukola,|because the world is better when you are.|Practice in small rooms and then in big ones.|I will be your quiet applause."]
,["A Quiet Victory","Not every victory comes with a cheer.|Some arrive in silent kitchens at midnight.|Some arrive as a single deep breath after a hard call.|Some arrive as an email you did not dread.|Those are yours, Bukola, and they count.|The world may never know how hard you fought.|But I know, and the One above knows.|There is a record of all your quiet wins.|Each one is a stone in a strong foundation.|One day you will stand on it and be amazed.|Until then, honour the small battles.|Thank yourself for the ones you showed up for.|You are winning, even when it feels like treading water.|I am proud of every quiet victory."]
,["In His Hands","Everything you are carrying, place it in His hands.|The worry about work, the weight of the week.|The thought you cannot stop repeating in your head.|The what-ifs, the maybes, the unfinished things.|He has big hands, big enough for it all.|He does not tire. He does not sigh.|He takes it gently and says, I have this.|You are free to be small for a moment.|Free to be tired and unfinished and unsure.|He is holding more than you can see.|You are held, Bukola, in the palm of grace.|Rest there as long as you need.|The One who made you will not drop you.|Not today, not ever."]
,["He Is Faithful","Through every season you have walked,|He has been faithful, even when you doubted.|He was there in the winter you survived.|He was there in the summer you forgot Him.|He is there tonight, as steady as the sun.|You may drift, but He does not move.|He is the same yesterday, today, forever.|Lean your whole weight on that, Bukola.|Faithfulness does not depend on your performance.|It depends on His character, which is love.|So rest. You do not have to hold Him up.|He is holding you, and always has.|Say thank you for what He has already done.|Say thank you for what He is about to."]
,["Wait on Him","Waiting is the hardest part of faith.|It feels like standing in an empty room.|But the room is not empty, Bukola.|Someone sits quietly beside you in the waiting.|Seeds wait underground in the dark.|Dawn waits behind the hills.|Your answer waits in the heart of God,|and it is on its way, wrapped in good timing.|He is never early and never late.|He is exactly on time, in His own way.|So wait with hope, not with dread.|Wait with songs, not with sighs.|The promise is coming, and it is beautiful.|I will wait with you, in prayer."]
,["Covered in Prayer","You are covered in prayer, whether you know it or not.|When you walk into a room, prayers go before you.|When you sleep, prayers keep watch.|Mine is one of them, and not the only one.|Heaven has heard your name many times.|You are not forgotten at the throne.|You are remembered, honoured, and loved.|Let that settle on your shoulders like a cloak.|You are protected by more than you can count.|Nothing can slip through that kind of covering.|So walk lightly, my friend.|Walk with trust, and a quiet smile.|The One who hears prayers is answering yours.|Keep believing, Bukola. It is working."]
,["Anchor","When the sea is wild, you need an anchor.|Not one that stops the waves, but one that holds.|Your hope in God is that anchor.|The boat may rock, but it will not drift away.|The waves may rise, but they will not win.|Hold on to the rope, Bukola, even when your hands ache.|The anchor is set deep, in solid rock.|It was fixed before the storm began.|You are safe, even when you do not feel safe.|The storm is loud, but the anchor is louder.|Rest in that. Breathe in that.|Morning will come over the water, golden and calm.|And you will step onto firm sand,|grateful for the One who held fast."]
,["Open Doors","There is a door in your future that no one can shut.|He opened it, and it stays open.|You may be standing in a hallway right now,|wondering where the next door is.|But the hallway is part of the plan.|It is preparing you for what lies behind the door.|Walk calmly, Bukola, and trust the timing.|Doors open for the patient and the faithful.|Do not force the wrong ones.|Wait for the one with your name on it.|When it opens, you will know.|Light will spill out, and welcome with it.|Step through with gratitude.|Everything you walked through was worth it."]
,["Thank You, Lord","Let us thank Him for the small things today.|For breath in the lungs, for a roof, for a friend.|For the strength to get up and try again.|For the people who care without being asked.|For mornings that arrive on time.|For music, for tea, for gentle rain.|Gratitude turns a heavy day into a lighter one.|It reminds the heart what is still good.|Say it out loud, Bukola, even quietly.|Thank You for getting me this far.|Thank You for what You are doing unseen.|Thank You for being with me, always.|A thankful heart cannot stay anxious for long.|I am thankful for you, too, and I tell Him so."]
,["Light in the Valley","Even the darkest valley has a light in it.|Not a floodlight, perhaps, but a lamp.|Just enough to see the next step.|That is how He guides, one step at a time.|You do not need to see the whole road.|You only need the lamp for your feet.|Trust it, Bukola, and keep walking.|The valley is not forever, only a passage.|On the other side, there is a hillside of green.|You will turn and look back at the shadow,|and see that you were never alone in it.|You will see footprints beside yours.|You will know exactly Who walked with you.|Keep walking. The lamp is lit."]
,["Blessed and Kept","May the Lord bless you and keep you.|May His face shine upon you and be gracious.|May He lift His countenance and give you peace.|That is my prayer for you tonight, Bukola.|May your coming and going be guarded.|May your sleep be sweet and your waking joyful.|May your work be fruitful and your rest deep.|May kindness follow you into every room.|May favour meet you at every turn.|May courage rise in you when it is needed.|May you always know you are loved.|May you never forget who holds you.|I speak these blessings over your life.|Let them find you, settle on you, and stay."]
,["Hope Does Not Disappoint","Hope in God does not leave you ashamed.|It may be delayed, but it does not die.|It is a quiet flame that survives the draft.|You can feel tired and still be hopeful.|You can cry and still believe.|You can doubt and still hold on.|Hope is not the absence of difficulty,|but the presence of a promise.|And the promise is for you, Bukola.|He who began a good work in you|will see it through to completion.|Trust the process, even when it is slow.|The ending is better than the middle.|I am hoping, and praying, and trusting with you."]
,["Thinking of You","You crossed my mind a moment ago.|You cross it often, if I am honest.|At odd times, in odd places,|I find myself wondering how your day went.|I wonder if you ate, if you smiled,|if someone was kind to you today.|I send a small wish across the distance,|a quiet, warm, unspoken hello.|If you felt something just then, it was me.|It was a thought wrapped in good wishes.|You are never far from my mind, Bukola.|Even when the days are busy and loud,|there is a corner of me that is yours.|Thinking of you is the nicest habit I have."]
,["Wherever You Are","Wherever you are as you read this,|a train, a desk, a bed, a quiet corner,|I hope you feel a little less alone.|I hope something in you softens.|I hope your shoulders drop an inch.|I hope you breathe in a little deeper.|You are held in a hundred invisible ways,|by me, by prayer, by good memory.|The distance between us is only space.|Words travel faster than any road.|So let these words land beside you,|and sit with you for as long as you like.|You are cared for, Bukola, always.|Wherever you are, I am with you."]
,["A Little Light for Tonight","Here is a little light for tonight.|Take it. It costs nothing, and it is yours.|Put it on your windowsill or in your pocket.|When the evening feels long, switch it on.|It says, you are loved.|It says, you are seen.|It says, tomorrow will be kinder.|It says, rest now, I will keep watch.|It hums softly with a kind of gentle hope.|It will not go out, I promise.|It was lit with a thousand small wishes.|Every one of them has your name on it.|Sleep well, Bukola.|Let the little light keep you company."]
,["What You Mean to Me","I do not always have the words,|so let me try with poems.|You mean steadiness in a shaky season.|You mean laughter when the room is grey.|You mean someone to tell the good news to first.|You mean a call I would never miss.|You mean the kind of kindness that heals.|You mean a friend, a light, a quiet joy.|I am glad you exist, Bukola.|I am glad our paths crossed and stayed crossed.|The world is better because you are in it.|My life is better because you are in mine.|I hope you hear that clearly today.|You matter to me, more than I can say."]
,["Soft Words for a Hard Day","Soft words for a hard day:|you are doing well.|You are more capable than you feel.|You are allowed to rest.|You are allowed to cry.|You are allowed to ask for help.|You do not have to be perfect.|You do not have to be strong every minute.|You are loved on your best days|and loved on your worst.|You are enough, right now, just as you are.|The day will end, and the night will be kind.|Tomorrow will offer a fresh start.|Hold these soft words close, Bukola."]
,["Come Back to Joy","Joy has not left you, only stepped out.|It will be back with its arms full.|Until then, leave a light on for it.|Open a window. Put on a song.|Let a small thing delight you today:|a bird, a colour, the smell of rain.|Joy often returns through small doors.|It comes on the back of gratitude.|It follows laughter, it follows rest.|Bukola, joy knows where you live.|It has your address and your name.|It will knock when you least expect it.|And you will open the door, smiling,|and say, oh, there you are. I missed you."]
,["Carry This With You","Carry this poem in your pocket today.|Let it be the weight that steadies you.|When the day goes sideways, touch it.|Remember the words that believe in you.|You are strong, and you are kind.|You are faithful, and you are loved.|You are not alone in any room.|You have a friend who prays, a God who stays.|You have a future that is gentle and bright.|Carry these truths, Bukola, like a charm.|They are not decoration, they are fact.|Let them walk beside you into the evening.|They will keep you company until we meet.|And they will remind you who you are."]
,["Every Day, a Little Closer","Every day you wake up, we are a day closer.|A day closer to the end of this heavy season.|A day closer to the day we meet again.|A day closer to everything good coming for you.|Time is passing, and it is on your side.|The calendar is quietly working in your favour.|One more sunrise, one more sunset.|One more deep breath, one more small win.|You are moving toward better days, Bukola,|even when it feels like standing still.|The road bends gently toward joy.|I will be at the turn, waiting with open arms.|Every day, a little closer.|Keep walking, my friend. Keep walking."]
,["Almost the Last Page","You have read so many of these words now.|I hope each one landed softly.|I hope a few of them stayed.|I wrote every line thinking of you.|Each one carries a wish, a hug, a prayer.|You were in my mind with every sentence.|If one poem made you smile, I am happy.|If one made you cry gently, that is good too.|Tears are only love with nowhere to go.|Know that none of this was made lightly.|It was made carefully, because you matter.|Bukola, there is one more page,|and then the book will rest in your hands.|Hold it close. It is yours, always."]
,["For Bukola, Always","This is the last poem, but not the last word.|The last word is always the same:|you are loved, you are held, you will be fine.|God is with you, and so am I.|Work will ease, and the sun will return.|The laughter will find you, and it will stay.|You are strong in ways you have not yet seen.|You are kind in ways that change people.|You are the reason a lot of rooms feel warm.|Thank you for being exactly who you are.|Thank you for letting me stand beside you,|even from this long distance.|Whatever tomorrow holds, hold it gently.|I will be here, Bukola. Always. Abidemi."]

function build(){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;
 const c=ctx.createDynamicsCompressor();master.connect(c);c.connect(ctx.destination);
 const len=ctx.sampleRate*4.5,ir=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len)**3}
